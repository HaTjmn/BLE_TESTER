; PlatformIO Project Configuration File -- HolterLEV BLE Test Controller
;
; Mirrors the HolterLEV firmware's own toolchain (c:/repos/ECG_ads1293/
; holterlev_1293-BLE/platformio.ini) for compatibility: same platform
; fork/version, same framework (espidf, not Arduino), same NimBLE stack.
;
; upload_port/monitor_port are pinned to COM28 -- the physically verified
; (esptool chip_id/flash_id) ESP32-S3 test-controller board -- specifically
; so this project can never be pointed at the HolterLEV DUT's own serial
; port by a missing/wrong -p flag or IDE default.

[env:esp32-s3-devkitc1-n16r16]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r16
framework = espidf

upload_port = COM28
monitor_port = COM28
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
